<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Markerless AR - Solar System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; display: block; }
    #ar-button {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 32px; font-size: 18px; font-weight: bold;
      background: #4CC3D9; color: white; border: none; border-radius: 10px; z-index: 999;
    }
    #debug-box {
      position: fixed; top: 16px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.85); color: #0f0; padding: 12px 16px;
      border-radius: 10px; font-size: 12px; z-index: 999; font-family: monospace;
      white-space: pre-wrap; max-height: 200px; overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="debug-box">Loading...</div>

  <model-viewer
    id="viewer"
    src="./earth.glb"
    alt="Earth"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    ar-placement="floor"
    shadow-intensity="1">
  </model-viewer>

  <button id="ar-button">View in AR</button>

  <script>
    const viewer = document.querySelector('#viewer');
    const button = document.querySelector('#ar-button');
    const debugBox = document.querySelector('#debug-box');

    function log(msg) {
      debugBox.textContent += "\n" + msg;
    }

    window.onerror = function(msg, url, line) {
      log("JS ERROR: " + msg + " (line " + line + ")");
    };

    viewer.addEventListener('load', () => {
      log("Model loaded OK");
      log("canActivateAR: " + viewer.canActivateAR);
    });

    viewer.addEventListener('error', (e) => {
      log("MODEL LOAD ERROR: " + JSON.stringify(e.detail));
    });

    viewer.addEventListener('ar-status', (e) => {
      log("AR status: " + e.detail.status);
    });

    button.addEventListener('click', () => {
      log("Button tapped. canActivateAR = " + viewer.canActivateAR);
      viewer.activateAR();
    });

    log("Script running. Waiting for model...");
  </script>
</body>
</html>
