<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Markerless AR - Solar System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }
    #instructions {
      position: fixed; top: 16px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.75); color: white; padding: 10px 14px;
      border-radius: 10px; font-size: 12px; text-align: center; z-index: 999;
    }
    #iss-info {
      position: fixed; top: 60px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.75); color: white; padding: 8px 14px;
      border-radius: 10px; font-size: 12px; text-align: center; z-index: 999;
    }
    #back-link {
      position: fixed; top: 100px; left: 16px;
      background: rgba(0,0,0,0.75); color: white; padding: 8px 16px;
      border-radius: 20px; font-size: 12px; text-decoration: none; z-index: 999;
    }
    #controls {
      position: fixed; bottom: 20px; right: 16px;
      display: flex; flex-direction: column; gap: 8px; z-index: 2000;
    }
    #controls-row { display: flex; gap: 8px; }
    #next-btn, #prev-btn, #speed-btn {
      background: #4CC3D9; color: white; padding: 8px 14px;
      border: none; border-radius: 20px; font-size: 12px; font-weight: bold;
    }
    #loading {
      position: fixed; top: 100px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.85); color: #ffcc66; padding: 8px 14px;
      border-radius: 10px; font-size: 12px; text-align: center;
      z-index: 500; pointer-events: none;
    }
    #loading.hidden { display: none; }
    #debug {
      position: fixed; bottom: 90px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.6); color: #0f0; padding: 6px 12px;
      border-radius: 8px; font-size: 10px; font-family: monospace;
      z-index: 500; text-align: center; pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">Loading 3D models…</div>
  <div id="instructions">👆 Tap "START AR", scan a surface, TAP the ring to place. Use Next/Prev to move the astronaut. Get closer for louder sound.</div>
  <div id="iss-info">Loading live ISS location...</div>
  <a href="./index.html" id="back-link">← Home</a>
  <div id="controls">
    <div id="controls-row">
      <button id="prev-btn">⏮ Prev</button>
      <button id="next-btn">🚀 Next</button>
    </div>
    <button id="speed-btn">Speed: Normal</button>
  </div>
  <div id="debug">debug: waiting…</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    // Hide the debug overlay by default — add ?debug to the URL to see it
    if (!location.search.includes('debug')) document.getElementById('debug').style.display = 'none';

    let camera, scene, renderer;
    let reticle, hitTestSource = null, hitTestSourceRequested = false;
    let placedGroup, earthContainer = null, astronautContainer = null, beaconLight = null;
    let earthLoaded = false, issLoaded = false, placed = false;

    const speeds = [
      { jump: 1.6, earthSpeed: 0.15, label: 'Slow' },
      { jump: 1.0, earthSpeed: 0.4, label: 'Normal' },
      { jump: 0.5, earthSpeed: 0.9, label: 'Fast' }
    ];
    let speedIndex = 1;

    const EARTH_SIZE = 0.08;
    const ASTRONAUT_SIZE = 0.02;
    const JUMP_HEIGHT = 0.03;

    const waypoints = [
      { x: -0.15, y: 0.015, z: 0.03 },
      { x: -0.09, y: 0.015, z: 0.03 },
      { x: -0.03, y: 0.015, z: 0.03 },
      { x:  0.03, y: 0.015, z: 0.03 },
      { x:  0.09, y: 0.015, z: 0.03 },
      { x:  0.15, y: 0.015, z: 0.03 }
    ];

    let currentIndex = 0;
    let jumpDirection = 1;
    let jumpState = 'idle';
    let jumpTimer = 0;

    // Squash & stretch on landing — astronautContainer's own scale is the
    // "neutral" (1,1,1) wrapper from normalizeModel, so we can animate it
    // directly as a multiplier without needing to track a base scale.
    let squashTimer = 0;
    const SQUASH_DURATION = 0.25;

    init();
    animate();

    function normalizeModel(object3D, targetSize) {
      const box = new THREE.Box3().setFromObject(object3D);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = targetSize / maxDim;
      object3D.scale.setScalar(scale);
      const box2 = new THREE.Box3().setFromObject(object3D);
      const center = new THREE.Vector3();
      box2.getCenter(center);
      object3D.position.sub(center);
      const container = new THREE.Group();
      container.add(object3D);
      return container;
    }

    function enableShadows(object3D) {
      object3D.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }
      });
    }

    function attachAstronautIfReady() {
      if (earthContainer && astronautContainer && astronautContainer.parent !== earthContainer) {
        earthContainer.add(astronautContainer);
        astronautContainer.position.set(waypoints[0].x, waypoints[0].y, waypoints[0].z);

        beaconLight = new THREE.PointLight(0x66ccff, 0.6, 0.4);
        astronautContainer.add(beaconLight);

        document.getElementById('loading').classList.add('hidden');
      }
    }

    setTimeout(() => {
      if (!(earthLoaded && issLoaded)) {
        const el = document.getElementById('loading');
        el.textContent = '⚠️ Models still not loaded after 10s. Check you opened this via http(s)://, not by double-clicking the file, and that earth.glb/iss.glb are in the same folder.';
        el.style.color = '#ff6666';
        el.classList.remove('hidden');
      }
    }, 10000);

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(1, 1, 1);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.set(1024, 1024);
      dirLight.shadow.camera.near = 0.01;
      dirLight.shadow.camera.far = 5;
      dirLight.shadow.camera.left = -0.3;
      dirLight.shadow.camera.right = 0.3;
      dirLight.shadow.camera.top = 0.3;
      dirLight.shadow.camera.bottom = -0.3;
      scene.add(dirLight);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace; // correct PBR color rendering, matches marker.html's colorManagement
      document.body.appendChild(renderer.domElement);

      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      });
      arButton.style.zIndex = '2000';
      arButton.style.opacity = '1'; // library defaults to 0.5 with no hover-brighten on touch devices
      arButton.addEventListener('click', enableSoundOnce);
      document.body.appendChild(arButton);

      const reticleGeo = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
      reticle = new THREE.Mesh(reticleGeo, new THREE.MeshBasicMaterial({ color: 0x4CC3D9 }));
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      placedGroup = new THREE.Group();
      placedGroup.visible = false;
      scene.add(placedGroup);

      const loader = new GLTFLoader();

      loader.load('./earth.glb', (gltf) => {
        enableShadows(gltf.scene);
        earthContainer = normalizeModel(gltf.scene, EARTH_SIZE);
        placedGroup.add(earthContainer);
        earthLoaded = true;
        attachAstronautIfReady();
      }, undefined, (err) => {
        console.error('Failed to load earth.glb', err);
        const el = document.getElementById('loading');
        el.textContent = 'Could not load earth.glb — check the file exists next to this page.';
        el.style.color = '#ff6666';
        el.classList.remove('hidden');
      });

      loader.load('./iss.glb', (gltf) => {
        enableShadows(gltf.scene);
        astronautContainer = normalizeModel(gltf.scene, ASTRONAUT_SIZE);
        issLoaded = true;
        attachAstronautIfReady();
      }, undefined, (err) => {
        console.error('Failed to load iss.glb', err);
        const el = document.getElementById('loading');
        el.textContent = 'Could not load iss.glb — check the file exists next to this page.';
        el.style.color = '#ff6666';
        el.classList.remove('hidden');
      });

      renderer.xr.addEventListener('sessionend', onSessionEnd);

      const controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      window.addEventListener('resize', onWindowResize);

      document.getElementById('speed-btn').addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        document.getElementById('speed-btn').textContent = 'Speed: ' + speeds[speedIndex].label;
        enableSoundOnce();
      });
      document.getElementById('next-btn').addEventListener('click', () => {
        enableSoundOnce();
        startJump(1);
      });
      document.getElementById('prev-btn').addEventListener('click', () => {
        enableSoundOnce();
        startJump(-1);
      });

      document.body.addEventListener('click', enableSoundOnce);
      document.body.addEventListener('touchstart', enableSoundOnce);

      updateISSLocation();
      setInterval(updateISSLocation, 5000);
    }

    function startJump(direction) {
      if (!astronautContainer || jumpState === 'jumping') return;
      jumpDirection = direction;
      jumpState = 'jumping';
      jumpTimer = 0;
      playBlip(300, 900, 0.25); // whoosh
    }

    function updateAstronaut(dt) {
      if (!astronautContainer) return;

      if (squashTimer > 0) {
        squashTimer = Math.max(0, squashTimer - dt);
        const intensity = squashTimer / SQUASH_DURATION;
        const sY = 1 - 0.3 * intensity;
        const sXZ = 1 + 0.15 * intensity;
        astronautContainer.scale.set(sXZ, sY, sXZ);
      }

      if (jumpState !== 'jumping') return;

      const duration = speeds[speedIndex].jump;
      jumpTimer += dt;
      const t = Math.min(1, jumpTimer / duration);

      const nextIndex = (currentIndex + jumpDirection + waypoints.length) % waypoints.length;
      const from = waypoints[currentIndex];
      const to = waypoints[nextIndex];

      const x = from.x + (to.x - from.x) * t;
      const z = from.z + (to.z - from.z) * t;
      const arc = Math.sin(t * Math.PI) * JUMP_HEIGHT;
      const y = from.y + (to.y - from.y) * t + arc;

      astronautContainer.position.set(x, y, z);

      // Face the direction of travel
      astronautContainer.rotation.y = jumpDirection > 0 ? Math.PI / 2 : -Math.PI / 2;

      if (t >= 1) {
        currentIndex = nextIndex;
        jumpState = 'idle';
        squashTimer = SQUASH_DURATION;
        playBlip(500, 150, 0.2); // thud
      }
    }

    function onSelect() {
      enableSoundOnce();
      if (!placed && reticle.visible) {
        placedGroup.position.setFromMatrixPosition(reticle.matrix);
        placedGroup.visible = true;
        placed = true;
        reticle.visible = false;
      }
      // Movement is now Next/Prev-button driven (see controls), for
      // consistency with the marker-based experience's UI language.
    }

    function onSessionEnd() {
      placed = false;
      placedGroup.visible = false;
      reticle.visible = false;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let audioCtx, oscillator, oscillator2, filterNode, gainNode, audioReady = false;

    function enableSoundOnce() {
      if (audioReady) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      oscillator = audioCtx.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.value = 130;
      oscillator2 = audioCtx.createOscillator();
      oscillator2.type = 'sine';
      oscillator2.frequency.value = 130 * 1.5;
      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.value = 800;
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 0;
      oscillator.connect(filterNode);
      oscillator2.connect(filterNode);
      filterNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.start();
      oscillator2.start();
      audioReady = true;
    }

    function playBlip(freqStart, freqEnd, duration) {
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freqStart, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + duration);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    }

    const camWorldPos = new THREE.Vector3();
    const groupWorldPos = new THREE.Vector3();
    let minSeen = Infinity;
    let maxSeen = -Infinity;

    function updateSound() {
      if (!audioReady) return;
      if (placed) {
        camera.getWorldPosition(camWorldPos);
        placedGroup.getWorldPosition(groupWorldPos);
        const distance = camWorldPos.distanceTo(groupWorldPos);

        if (distance < minSeen) minSeen = distance;
        if (distance > maxSeen) maxSeen = distance;
        const range = Math.max(maxSeen - minSeen, 0.0001);
        const closeness = 1 - (distance - minSeen) / range;

        const volume = 0.15 + closeness * 0.35;
        const filterFreq = 400 + closeness * 1200;
        const pitch = 120 + closeness * 40;

        gainNode.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.15);
        filterNode.frequency.setTargetAtTime(filterFreq, audioCtx.currentTime, 0.15);
        oscillator.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.15);
        oscillator2.frequency.setTargetAtTime(pitch * 1.5, audioCtx.currentTime, 0.15);

        document.getElementById('debug').textContent =
          `earth:${earthLoaded} iss:${issLoaded} placed:${placed} | planet: ${currentIndex + 1}/${waypoints.length} | jump: ${jumpState} | speed: ${speeds[speedIndex].label} | dist: ${distance.toFixed(2)}m vol: ${volume.toFixed(2)}`;
      } else {
        gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
        document.getElementById('debug').textContent =
          `earth:${earthLoaded} iss:${issLoaded} placed:${placed} | planet: ${currentIndex + 1}/${waypoints.length} | jump: ${jumpState} | speed: ${speeds[speedIndex].label}`;
      }
    }

    async function updateISSLocation() {
      try {
        const response = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
        const data = await response.json();
        document.querySelector('#iss-info').innerHTML =
          `🛰️ ISS Live — Lat ${data.latitude.toFixed(2)}°, Lon ${data.longitude.toFixed(2)}° · ` +
          `Alt ${data.altitude.toFixed(1)} km · ${data.velocity.toFixed(0)} km/h`;
      } catch (e) {
        document.querySelector('#iss-info').textContent = "Could not fetch ISS data";
      }
    }

    const clock = new THREE.Clock();
    function animate() { renderer.setAnimationLoop(render); }

    function render(timestamp, frame) {
      const delta = clock.getDelta();
      if (earthContainer) earthContainer.rotation.y += delta * speeds[speedIndex].earthSpeed;
      updateAstronaut(delta);
      if (beaconLight) beaconLight.intensity = 0.4 + Math.sin(timestamp / 300) * 0.25;

      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource && !placed) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            reticle.visible = true;
            reticle.matrix.fromArray(hitTestResults[0].getPose(referenceSpace).transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      updateSound();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
