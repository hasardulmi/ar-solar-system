<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Markerless AR - Solar System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; display: block; }

    #top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: center; gap: 10px;
      padding: 14px 10px; z-index: 999;
    }
    .toggle-btn {
      padding: 10px 20px; font-size: 15px; font-weight: bold;
      border: 2px solid #4CC3D9; border-radius: 20px;
      background: white; color: #4CC3D9;
    }
    .toggle-btn.active {
      background: #4CC3D9; color: white;
    }

    #iss-info {
      position: fixed; top: 64px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.75); color: white; padding: 10px 14px;
      border-radius: 10px; font-size: 13px; z-index: 999; text-align: center;
    }

    #ar-button {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 32px; font-size: 18px; font-weight: bold;
      background: #4CC3D9; color: white; border: none; border-radius: 10px; z-index: 999;

      #instructions {
      position: fixed; top: 108px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.7); color: white; padding: 8px 14px;
      border-radius: 10px; font-size: 12px; text-align: center; z-index: 999;
}
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <button class="toggle-btn active" id="btn-earth">🌍 Earth</button>
    <button class="toggle-btn" id="btn-iss">🛰️ ISS</button>
  </div>

  <div id="instructions">👆 Tap "View in AR", then point your phone at the floor</div>
  <div id="iss-info">Loading live ISS location...</div>

  <model-viewer
    id="viewer"
    src="./earth.glb"
    alt="3D model"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    ar-placement="floor"
    shadow-intensity="1">
  </model-viewer>

  <button id="ar-button">View in AR</button>

  <script>
    const viewer = document.querySelector('#viewer');
    const arButton = document.querySelector('#ar-button');
    const issInfo = document.querySelector('#iss-info');
    const btnEarth = document.querySelector('#btn-earth');
    const btnIss = document.querySelector('#btn-iss');

    // Toggle between Earth and ISS models
    btnEarth.addEventListener('click', () => {
      viewer.src = './earth.glb';
      btnEarth.classList.add('active');
      btnIss.classList.remove('active');
    });

    btnIss.addEventListener('click', () => {
      viewer.src = './iss.glb';
      btnIss.classList.add('active');
      btnEarth.classList.remove('active');
    });

    // AR button
    arButton.addEventListener('click', () => {
      viewer.activateAR();
    });

    // Live ISS location - updates every 5 seconds regardless of which model is shown
    async function updateISSLocation() {
      try {
        const response = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
        const data = await response.json();
        const lat = data.latitude.toFixed(2);
        const lon = data.longitude.toFixed(2);
        const altitude = data.altitude.toFixed(1);
        const velocity = data.velocity.toFixed(0);

        issInfo.innerHTML =
          `🛰️ ISS Live — Lat ${lat}°, Lon ${lon}° · Alt ${altitude} km · ${velocity} km/h`;
      } catch (error) {
        issInfo.textContent = "Could not fetch ISS data — check internet connection";
      }
    }

    updateISSLocation();
    setInterval(updateISSLocation, 5000);
  </script>
</body>
</html>
