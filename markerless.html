<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Markerless AR - Solar System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene webxr="requiredFeatures: hit-test;" ar-hit-test="target:#solarModel;">
    
    <a-entity id="solarModel" visible="false">
      <a-sphere position="0 0.5 0" radius="0.3" color="#4CC3D9"></a-sphere>
    </a-entity>

    <a-entity camera position="0 1.6 0"></a-entity>
  </a-scene>
</body>
</html>
