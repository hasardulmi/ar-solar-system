<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Markerless AR - Solar System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene
    webxr="requiredFeatures: hit-test; referenceSpaceType: local-floor;"
    renderer="alpha: true;"
    ar-hit-test="target:#solarModel;">

    <a-entity id="solarModel" visible="false">
      <a-sphere radius="0.1" color="#4CC3D9"></a-sphere>
    </a-entity>

    <a-entity camera position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    document.querySelector('a-scene').addEventListener('ar-hit-test-select', function () {
      document.querySelector('#solarModel').setAttribute('visible', true);
    });
  </script>
</body>
</html>
