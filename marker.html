<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Marker AR - Solar System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #instructions {
      position: fixed; top: 16px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.75); color: white; padding: 12px 16px;
      border-radius: 10px; font-size: 14px; text-align: center; z-index: 999;
    }
    #back-link {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: white; padding: 10px 20px;
      border-radius: 20px; font-size: 14px; text-decoration: none; z-index: 999;
    }
  </style>
</head>
<body>
  <div id="instructions">📷 Point your camera at the marker image to see Earth appear</div>
  <a href="./index.html" id="back-link">← Back to Home</a>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item id="earthModel" src="./earth.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="1 1 1"></a-light>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        rotation="0 0 0"
        position="0 0 0.1"
        scale="0.3 0.3 0.3"
        src="#earthModel"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
      ></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
