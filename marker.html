<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Marker AR - Solar System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <script src="https://unpkg.com/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #instructions {
      position: fixed; top: 16px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.75); color: white; padding: 10px 14px;
      border-radius: 10px; font-size: 13px; text-align: center; z-index: 999;
    }
    #debug {
      position: fixed; top: 70px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.6); color: #0f0; padding: 6px 12px;
      border-radius: 8px; font-size: 11px; font-family: monospace; z-index: 999; text-align: center;
    }
    #back-link {
      position: fixed; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.75); color: white; padding: 10px 18px;
      border-radius: 20px; font-size: 13px; text-decoration: none; z-index: 999;
    }
    #controls {
      position: fixed; bottom: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 8px; z-index: 999;
    }
    #controls-row { display: flex; gap: 8px; }
    #next-btn, #prev-btn, #speed-btn {
      background: #4CC3D9; color: white; padding: 10px 14px;
      border: none; border-radius: 20px; font-size: 13px; font-weight: bold;
    }
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: black; color: white; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      font-size: 16px; z-index: 1000; text-align: center; padding: 0 30px;
    }
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.2); border-top-color: #4CC3D9;
      animation: spin 0.9s linear infinite; margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-percent { font-size: 20px; font-weight: bold; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Downloading 3D models…</div>
    <div id="loading-percent">0%</div>
  </div>
  <div id="instructions">📷 Point at the marker · tap "Next/Prev" to move the astronaut</div>
  <div id="debug">distance: -- | volume: --</div>
  <a href="./index.html" id="back-link">← Home</a>
  <div id="controls">
    <div id="controls-row">
      <button id="prev-btn">⏮ Prev</button>
      <button id="next-btn">🚀 Next</button>
    </div>
    <button id="speed-btn">Speed: Normal</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true, shadowMap.enabled: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item id="earthModel" src="./earth.glb"></a-asset-item>
      <a-asset-item id="issModel" src="./iss.glb"></a-asset-item>
    </a-assets>

    <a-camera id="camera" position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-entity
      light="type: directional; color: #ffffff; intensity: 0.9; castShadow: true;
             shadowMapHeight: 2048; shadowMapWidth: 2048;
             shadowCameraLeft: -0.3; shadowCameraRight: 0.3;
             shadowCameraTop: 0.3; shadowCameraBottom: -0.3;
             shadowCameraNear: 0.01; shadowCameraFar: 2;
             shadowBias: -0.001"
      position="1 1 1">
    </a-entity>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-entity id="earth" gltf-model="#earthModel" position="0 0 0.1" scale="0.3 0.3 0.3" shadow="receive: true"></a-entity>

      <a-entity id="astronaut" gltf-model="#issModel" scale="0.05 0.05 0.05" rotation="0 90 0" shadow="cast: true">

        <!-- Beacon: spotlight pointing down at Earth's surface, sweeping like a lighthouse -->
        <a-entity id="beaconRig" position="0 0.1 0">
          <a-entity
            id="beacon"
            light="type: spot; color: #66ccff; intensity: 2.5; distance: 1.5; angle: 25; penumbra: 0.4; target: #beaconTarget"
            position="0 0 0">
          </a-entity>
          <a-entity id="beaconTarget" position="0 -0.6 0.3"></a-entity>

          <!-- Visible beam cone (glowing, additive-style transparency) -->
          <a-cone
            id="beamCone"
            radius-bottom="0.06" radius-top="0.002" height="0.5"
            position="0 -0.25 0.15" rotation="70 0 0"
            material="color: #66ccff; opacity: 0.25; transparent: true; shader: flat; side: double"
            shadow="cast: false; receive: false">
          </a-cone>
        </a-entity>

      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const loadingEl = document.querySelector('#loading');
    const targetEl = document.querySelector('#target');
    const cameraEl = document.querySelector('#camera');
    const earthEl = document.querySelector('#earth');
    const astronautEl = document.querySelector('#astronaut');
    const beaconRigEl = document.querySelector('#beaconRig');
    const beaconEl = document.querySelector('#beacon');
    const beamConeEl = document.querySelector('#beamCone');
    const speedBtn = document.querySelector('#speed-btn');
    const nextBtn = document.querySelector('#next-btn');
    const prevBtn = document.querySelector('#prev-btn');
    const debugEl = document.querySelector('#debug');

    if (!location.search.includes('debug')) debugEl.style.display = 'none';

    sceneEl.addEventListener('loaded', () => {
      document.getElementById('loading-percent').textContent = '100%';
      document.getElementById('loading-text').textContent = 'Ready!';
      setTimeout(() => { loadingEl.style.display = 'none'; }, 250);
    });

    let fakePct = 0;
    const progressTimer = setInterval(() => {
      if (fakePct < 90) {
        fakePct += Math.random() * 6;
        document.getElementById('loading-percent').textContent = Math.min(90, Math.floor(fakePct)) + '%';
      }
    }, 250);
    sceneEl.addEventListener('loaded', () => clearInterval(progressTimer));

    setTimeout(() => {
      if (loadingEl.style.display !== 'none') {
        document.getElementById('loading-text').textContent =
          '⚠️ Still loading — this usually means the .glb model files are large. Check your connection, or compress the models (see gltf.report).';
      }
    }, 15000);

    const waypoints = [
      { x: -0.55, y: 0.05, z: 0.12 },
      { x: -0.33, y: 0.05, z: 0.12 },
      { x: -0.11, y: 0.05, z: 0.12 },
      { x:  0.11, y: 0.05, z: 0.12 },
      { x:  0.33, y: 0.05, z: 0.12 },
      { x:  0.55, y: 0.05, z: 0.12 }
    ];

    let currentIndex = 0;
    let jumpDirection = 1;
    let jumpState = 'idle';
    let jumpTimer = 0;
    const JUMP_HEIGHT = 0.15;
    const BASE_SCALE = 0.05;

    let squashTimer = 0;
    const SQUASH_DURATION = 0.25;

    astronautEl.setAttribute('position', `${waypoints[0].x} ${waypoints[0].y} ${waypoints[0].z}`);

    function startJump(direction) {
      if (jumpState === 'jumping') return;
      jumpDirection = direction;
      jumpState = 'jumping';
      jumpTimer = 0;
      playBlip(300, 900, 0.25);
    }

    function updateAstronaut(dt) {
      if (squashTimer > 0) {
        squashTimer = Math.max(0, squashTimer - dt);
        const intensity = squashTimer / SQUASH_DURATION;
        const scaleY = BASE_SCALE * (1 - 0.3 * intensity);
        const scaleXZ = BASE_SCALE * (1 + 0.15 * intensity);
        astronautEl.setAttribute('scale', `${scaleXZ} ${scaleY} ${scaleXZ}`);
      }

      if (jumpState !== 'jumping') return;

      const duration = speeds[speedIndex].jump;
      jumpTimer += dt;
      const t = Math.min(1, jumpTimer / duration);

      const nextIndex = (currentIndex + jumpDirection + waypoints.length) % waypoints.length;
      const from = waypoints[currentIndex];
      const to = waypoints[nextIndex];

      const x = from.x + (to.x - from.x) * t;
      const z = from.z + (to.z - from.z) * t;
      const arc = Math.sin(t * Math.PI) * JUMP_HEIGHT;
      const y = from.y + (to.y - from.y) * t + arc;

      astronautEl.setAttribute('position', `${x} ${y} ${z}`);

      const facingDeg = jumpDirection > 0 ? 90 : -90;
      astronautEl.setAttribute('rotation', `0 ${90 + facingDeg} 0`);

      if (t >= 1) {
        currentIndex = nextIndex;
        jumpState = 'idle';
        squashTimer = SQUASH_DURATION;
        playBlip(500, 150, 0.2);
      }
    }

    nextBtn.addEventListener('click', () => {
      ensureAudio();
      startJump(1);
    });
    prevBtn.addEventListener('click', () => {
      ensureAudio();
      startJump(-1);
    });

    const speeds = [
      { earthSpeed: 15, jump: 1.6, label: 'Slow' },
      { earthSpeed: 40, jump: 1.0, label: 'Normal' },
      { earthSpeed: 90, jump: 0.5, label: 'Fast' }
    ];
    let speedIndex = 1;
    let earthAngle = 0;
    let lastTime = performance.now();
    let markerVisible = false;
    let beaconSweepAngle = 0;

    function tick(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (markerVisible) {
        earthAngle = (earthAngle + speeds[speedIndex].earthSpeed * dt) % 360;
        earthEl.setAttribute('rotation', `0 ${earthAngle} 0`);
        updateAstronaut(dt);

        // Pulse the spotlight's brightness
        const pulse = 1.8 + Math.sin(now / 300) * 1.2;
        beaconEl.setAttribute('light', 'intensity', pulse);

        // Slowly sweep the beacon rig like a lighthouse
        beaconSweepAngle = (beaconSweepAngle + 25 * dt) % 360;
        const sweepOffset = Math.sin(THREE.MathUtils.degToRad(beaconSweepAngle)) * 20;
        beaconRigEl.setAttribute('rotation', `0 ${sweepOffset} 0`);

        // Fade the visible beam in sync with the pulse
        const beamOpacity = 0.15 + (pulse - 0.6) * 0.08;
        beamConeEl.setAttribute('material', 'opacity', Math.max(0.1, Math.min(0.4, beamOpacity)));
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    speedBtn.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % speeds.length;
      speedBtn.textContent = 'Speed: ' + speeds[speedIndex].label;
      ensureAudio();
    });

    let audioCtx, oscillator, oscillator2, filterNode, gainNode, audioStarted = false;

    function ensureAudio() {
      if (!audioStarted) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        oscillator = audioCtx.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.value = 130;
        oscillator2 = audioCtx.createOscillator();
        oscillator2.type = 'sine';
        oscillator2.frequency.value = 130 * 1.5;
        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.value = 800;
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0;
        oscillator.connect(filterNode);
        oscillator2.connect(filterNode);
        filterNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator2.start();
        audioStarted = true;
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBlip(freqStart, freqEnd, duration) {
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freqStart, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + duration);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    }

    document.body.addEventListener('touchstart', ensureAudio);
    document.body.addEventListener('click', ensureAudio);

    targetEl.addEventListener('targetFound', () => {
      ensureAudio();
      markerVisible = true;
    });
    targetEl.addEventListener('targetLost', () => {
      markerVisible = false;
      if (gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
    });

    const camWorldPos = new THREE.Vector3();
    const targetWorldPos = new THREE.Vector3();
    let minSeen = Infinity;
    let maxSeen = -Infinity;

    function updateSoundByDistance() {
      if (markerVisible && gainNode && cameraEl.object3D && targetEl.object3D) {
        cameraEl.object3D.getWorldPosition(camWorldPos);
        targetEl.object3D.getWorldPosition(targetWorldPos);
        const distance = camWorldPos.distanceTo(targetWorldPos);
        if (distance < minSeen) minSeen = distance;
        if (distance > maxSeen) maxSeen = distance;
        const range = Math.max(maxSeen - minSeen, 0.0001);
        const closeness = 1 - (distance - minSeen) / range;
        const volume = 0.15 + closeness * 0.35;
        const filterFreq = 400 + closeness * 1200;
        const pitch = 120 + closeness * 40;
        gainNode.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.3);
        filterNode.frequency.setTargetAtTime(filterFreq, audioCtx.currentTime, 0.3);
        oscillator.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.3);
        oscillator2.frequency.setTargetAtTime(pitch * 1.5, audioCtx.currentTime, 0.3);
        debugEl.textContent = `dist: ${distance.toFixed(0)} | vol: ${volume.toFixed(2)} | planet: ${currentIndex + 1}/${waypoints.length}`;
      } else {
        debugEl.textContent = `marker not visible | planet: ${currentIndex + 1}/${waypoints.length}`;
      }
      requestAnimationFrame(updateSoundByDistance);
    }
    updateSoundByDistance();
  </script>
</body>
</html>
